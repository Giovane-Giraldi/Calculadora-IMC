<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="js.js" defer></script>
</head>
<body class="background">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Calculadora de IMC</a>
            <a class="navbar-brand" href="#">Nada ainda</a>
             <a class="navbar-brand" href="#">Nada ainda 2</a>

        </div>
    </nav>
    <div class="container mt-5">
        <form id="form">
            
            <label  for="peso" class="form-label">Peso (kg):</label>
            <input type="number" id="peso" class="form-control mb-3" placeholder="60" required>
            <label class="form-label" for="altura">Altura (m):</label>
            <input type="text" id="altura" class="form-control mb-3" placeholder="1,70" inputmode="decimal" required>
            <button type="submit" class="btn btn-primary">Calcular IMC</button>
            <button type="reset" class="btn btn-secondary">Limpar</button>
            
            
        </form>
    </div>
    <div class="container mt-3">
        <h4>Resultado</h4>
        <div class="card p 3">    
            <p id="resultado" class="fs-5"></p>
    </div>
    </div>
</body>
</html>
